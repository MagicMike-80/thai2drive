# Test branch only. The inspector and bootstrap must both pass before app import.
name: Michael V6 isolated gate candidate
on:
  push:
    branches:
      - test/michael-v6-isolation
    paths:
      - .github/workflows/michael-v6-isolated.yml
      - tests/michael_v6_isolated/**
      - backend/teacher_chat.py
      - backend/server.py
      - backend/webapp.py
      - backend/stopping_distance_web.py
      - backend/studybook_web.py
      - backend/i18n_routing.py
      - backend/site_config.py
      - backend/michael_v6_policy.py
      - backend/michael_v6_stop_sign.json
      - backend/tests/test_michael_v6*.py
      - backend/michael_v6_quota.py
      - backend/ai_learning.py
      - backend/michael_greetings.py
      - backend/media_catalog.py
      - backend/learning_areas.json
      - backend/regelbank.json
      - backend/docs/1_JURIDISK_TRAFIKKFASIT_2026.md
      - backend/docs/2_MICHAEL_PEDAGOGIKK_OG_GATELOGIKK_2026.md
      - backend/docs/3_NORSK_THAI_FELLEORD_OG_KULTUR_2026.md
permissions:
  contents: read
jobs:
  isolated-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/teacher_chat.py
            /backend/server.py
            /backend/webapp.py
            /backend/stopping_distance_web.py
            /backend/studybook_web.py
            /backend/i18n_routing.py
            /backend/site_config.py
            /backend/michael_v6_policy.py
            /backend/michael_v6_stop_sign.json
            /backend/tests/test_michael_v6*.py
            /backend/michael_v6_quota.py
            /backend/ai_learning.py
            /backend/michael_greetings.py
            /backend/media_catalog.py
            /backend/learning_areas.json
            /backend/regelbank.json
            /backend/docs/1_JURIDISK_TRAFIKKFASIT_2026.md
            /backend/docs/2_MICHAEL_PEDAGOGIKK_OG_GATELOGIKK_2026.md
            /backend/docs/3_NORSK_THAI_FELLEORD_OG_KULTUR_2026.md
            /tests/michael_v6_isolated/
      - name: Validate the web sender with synthetic inputs and no network
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          for test in test_v6_availability test_v6_text_event test_v6_web_intent; do
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
              --no-new-privs env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
              "$node_bin" "tests/michael_v6_isolated/$test.cjs"
          done
      - name: Check delayed replies in isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/v6-browser"
          mkdir -p "$deps/home"
          curl --fail --silent --show-error --location \
            https://registry.npmjs.org/playwright-core/-/playwright-core-1.62.1.tgz -o "$deps/playwright.tgz"
          digest="$(openssl dgst -sha512 -binary "$deps/playwright.tgz" | openssl base64 -A)"
          test "$digest" = 'wPYSwEBJY9GHraISXqyqtx0na0LpO3XEX7jNDhntbex7tzUS7kLnZsOlFruFJB4Hi/rhDMjXGqHewDZ68nYZVw=='
          tar -xzf "$deps/playwright.tgz" -C "$deps"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --no-new-privs env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$deps/home" \
            V6_PLAYWRIGHT_PATH="$deps/package" V6_CHROME_PATH="$(command -v google-chrome)" \
            "$(command -v node)" tests/michael_v6_isolated/test_v6_browser_dom.cjs
      - name: Build candidate image on runner
        shell: bash
        run: |
          set -euo pipefail
          build_context="$RUNNER_TEMP/michael-v6-image-build"
          mkdir -p "$build_context"
          git show HEAD:tests/michael_v6_isolated/Dockerfile.candidate > "$build_context/Dockerfile"
          git show HEAD:tests/michael_v6_isolated/requirements-candidate.txt > "$build_context/requirements-candidate.txt"
          docker build --pull --iidfile "$RUNNER_TEMP/v6-image-id" \
            -f "$build_context/Dockerfile" "$build_context"
          [[ "$(cat "$RUNNER_TEMP/v6-image-id")" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Prepare only reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/michael-v6-input"
          mkdir -p "$input"
          cp --parents \
            backend/server.py backend/teacher_chat.py backend/michael_v6_policy.py backend/ai_learning.py \
            backend/michael_v6_quota.py backend/michael_v6_stop_sign.json \
            backend/webapp.py backend/studybook_web.py backend/stopping_distance_web.py \
            backend/i18n_routing.py backend/site_config.py \
            backend/michael_greetings.py backend/media_catalog.py \
            backend/learning_areas.json backend/regelbank.json \
            backend/docs/1_JURIDISK_TRAFIKKFASIT_2026.md \
            backend/docs/2_MICHAEL_PEDAGOGIKK_OG_GATELOGIKK_2026.md \
            backend/docs/3_NORSK_THAI_FELLEORD_OG_KULTUR_2026.md \
            tests/michael_v6_isolated/bootstrap.py tests/michael_v6_isolated/fake_services.py \
            tests/michael_v6_isolated/v6_endpoint_scenarios.py \
            tests/michael_v6_isolated/stop_sign_candidate_v1.json "$input"
      - name: Inspect and start network-isolated gate
        shell: bash
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/v6-image-id")"
          input="$RUNNER_TEMP/michael-v6-input"
          container="michael-v6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker create --interactive --name "$container" --network none --read-only \
            --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
            --mount "type=bind,src=$input,dst=/sandbox/input,readonly" \
            --workdir /sandbox/input --entrypoint /usr/bin/env "$image" \
            -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            MICHAEL_TEST_MODE=synthetic /usr/local/bin/python -I -B \
            /sandbox/input/tests/michael_v6_isolated/bootstrap.py >/dev/null
          docker inspect "$container" > "$RUNNER_TEMP/v6-inspection.json"
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" \
            python3 -I -B tests/michael_v6_isolated/inspect_container.py \
            "$RUNNER_TEMP/v6-inspection.json" "$input" "$image"
          # Only the inspected, network-isolated container may import the app.
          channel="$RUNNER_TEMP/v6-browser-requests"
          mkfifo -m 600 "$channel"
          deps="$RUNNER_TEMP/v6-browser"
          timeout 180 docker start --attach --interactive "$container" < "$channel" | \
            timeout 180 sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
              --no-new-privs env -i PATH=/usr/bin:/bin LANG=C.UTF-8 HOME="$deps/home" \
              V6_PLAYWRIGHT_PATH="$deps/package" V6_CHROME_PATH="$(command -v google-chrome)" \
              "$(command -v node)" tests/michael_v6_isolated/browser_delivery.cjs > "$channel"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
      - name: Run existing offline V6 regression suites
        shell: bash
        run: |
          set -euo pipefail
          offline=(sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)"
            --clear-groups --no-new-privs env -i PATH=/usr/bin:/bin LANG=C.UTF-8)
          "${offline[@]}" python3 -I -B -m unittest discover -s backend/tests -p 'test_michael_v6*.py' -v
          # Each suite owns its process-wide synthetic modules and audit hooks.
          for suite in tests/michael_v6_isolated/test_*.py; do
            "${offline[@]}" python3 -I -B "$suite" -v
          done
