name: Build Expo Web App

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build & commit Expo web bundle
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Export Expo web app
        run: |
          cd frontend
          npx expo export --platform web --output-dir dist
        env:
          EXPO_NO_DOTENV: 1

      - name: Copy dist to backend/webapp
        run: |
          rm -rf backend/webapp
          cp -r frontend/dist backend/webapp

      - name: Commit web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/webapp
          git diff --staged --quiet || git commit -m "chore: rebuild Expo web bundle [skip ci]"
          git push
