<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thai2Drive — Admin</title>
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --card:#334155; --accent:#3b82f6;
    --good:#10b981; --warn:#f59e0b; --bad:#ef4444; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--panel);padding:14px 20px;display:flex;justify-content:space-between;
         align-items:center;border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:18px}
  header .right{font-size:13px;color:var(--muted)}
  header button{background:var(--card);color:var(--text);border:0;padding:6px 12px;border-radius:6px;
                cursor:pointer;margin-left:8px}

  #login{max-width:360px;margin:80px auto;padding:32px;background:var(--panel);
         border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #login h2{margin-top:0;text-align:center}
  #login input{width:100%;padding:12px;margin:8px 0;background:var(--card);color:var(--text);
               border:1px solid #475569;border-radius:8px;font-size:15px}
  #login button{width:100%;padding:12px;background:var(--accent);color:#fff;border:0;
                border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
  #login .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
  #login .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}

  #app{display:none;padding:16px;max-width:1400px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);padding:14px;border-radius:10px}
  .stat .v{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .progress-bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden;margin-top:8px}
  .progress-bar>div{height:100%;background:var(--good);transition:width .3s}

  .filters{background:var(--panel);padding:12px;border-radius:10px;margin-bottom:12px;
           display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters input,.filters select{background:var(--card);color:var(--text);
           border:1px solid #475569;border-radius:6px;padding:8px 10px;font-size:14px}
  .filters input[type=text]{min-width:200px;flex:1}
  .filters label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}

  #results-meta{font-size:13px;color:var(--muted);margin:8px 0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .q{background:var(--panel);border-radius:10px;padding:12px;border:1px solid #334155;
     cursor:pointer;transition:transform .15s}
  .q:hover{transform:translateY(-2px);border-color:var(--accent)}
  .q .img-wrap{height:140px;background:var(--card);border-radius:6px;overflow:hidden;
               margin-bottom:10px;display:flex;align-items:center;justify-content:center}
  .q .img-wrap img{width:100%;height:100%;object-fit:contain}
  .q .no-img{color:var(--muted);font-size:12px}
  .q .q-text{font-size:14px;line-height:1.4;margin-bottom:8px;
             display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .q .meta{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}
  .q .tag{background:var(--card);padding:2px 6px;border-radius:4px;color:var(--muted)}
  .q .tag.good{background:var(--good);color:#0b2b1f}
  .q .tag.bad{background:var(--bad);color:#2b0b0b}
  .q .tag.correct{background:var(--accent);color:#fff}

  /* Detail modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
         align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:100}
  .modal.show{display:flex}
  .modal-content{background:var(--panel);border-radius:12px;max-width:800px;width:100%;
                 padding:24px;max-height:90vh;overflow-y:auto}
  .modal-content img{max-width:100%;border-radius:8px;margin-bottom:16px}
  .modal-content .close{float:right;cursor:pointer;font-size:24px;color:var(--muted);
                        background:none;border:0}
  .modal h2{margin-top:0}
  .lang-row{margin:8px 0;padding:8px;background:var(--card);border-radius:6px}
  .lang-row .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
                 letter-spacing:.5px;margin-bottom:4px}
  .opt{padding:8px;margin:4px 0;background:var(--card);border-radius:6px}
  .opt.correct{background:#065f46;border-left:3px solid var(--good)}

  .pagination{display:flex;gap:8px;justify-content:center;margin:16px 0}
  .pagination button{background:var(--card);color:var(--text);border:0;padding:8px 14px;
                     border-radius:6px;cursor:pointer}
  .pagination button:disabled{opacity:.4;cursor:not-allowed}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel);padding:12px 18px;
         border-radius:8px;border-left:4px solid var(--good);z-index:200;display:none}
  .toast.show{display:block}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--panel);
        padding:6px;border-radius:10px;width:fit-content}
  .tab{padding:8px 20px;border-radius:7px;border:0;background:none;color:var(--muted);
       font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
  .tab.active{background:var(--accent);color:#fff}
  .tab:hover:not(.active){background:var(--card);color:var(--text)}

  /* Book panel */
  #book-view{display:none}
  .book-ch{background:var(--panel);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .book-ch-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
                cursor:pointer;user-select:none}
  .book-ch-head:hover{background:var(--card)}
  .book-ch-head h3{margin:0;font-size:15px}
  .book-ch-head .meta{font-size:12px;color:var(--muted)}
  .book-ch-body{display:none;padding:0 12px 12px}
  .book-ch-body.open{display:block}
  .book-sec{background:var(--card);border-radius:8px;margin:6px 0;padding:12px 14px;
            display:flex;align-items:flex-start;gap:12px}
  .book-sec-thumb{width:64px;height:48px;background:var(--bg);border-radius:6px;
                  flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .book-sec-thumb img{width:100%;height:100%;object-fit:contain}
  .book-sec-thumb .no-img{font-size:20px}
  .book-sec-info{flex:1;min-width:0}
  .book-sec-info .num{font-size:11px;color:var(--muted);margin-bottom:2px}
  .book-sec-info .title{font-size:14px;font-weight:700;white-space:nowrap;
                        overflow:hidden;text-overflow:ellipsis}
  .book-sec-info .preview{font-size:12px;color:var(--muted);margin-top:3px;
                          display:-webkit-box;-webkit-line-clamp:2;
                          -webkit-box-orient:vertical;overflow:hidden}
  .book-sec-actions{display:flex;gap:6px;flex-shrink:0}
  .book-sec-actions button{padding:5px 10px;border:0;border-radius:6px;font-size:12px;
                           cursor:pointer;font-weight:600}
  .btn-edit{background:var(--accent);color:#fff}
  .btn-del{background:var(--bad);color:#fff}
</style>
</head>
<body>

<div id="login">
  <h2>🚗 Thai2Drive Admin</h2>
  <input id="email" type="email" placeholder="admin@thai2drive.com" autocomplete="username" />
  <input id="password" type="password" placeholder="passord" autocomplete="current-password" />
  <button onclick="login()">Logg inn</button>
  <div id="login-err" class="err"></div>
  <div class="hint">Bruk admin-kontoen som er registrert i databasen.</div>
</div>

<header id="app-header" style="display:none">
  <h1>🚗 Thai2Drive Admin</h1>
  <div class="right">
    <span id="user-email"></span>
    <button onclick="logout()">Logg ut</button>
  </div>
</header>

<main id="app">
  <div class="stats" id="stats"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-questions" onclick="switchTab('questions')">📝 Spørsmål</button>
    <button class="tab" id="tab-book" onclick="switchTab('book')">📖 Læringsbok</button>
  </div>

  <!-- ── QUESTIONS VIEW ─────────────────────────────────── -->
  <div id="questions-view">
  <div class="filters">
    <input id="search" type="text" placeholder="Søk i spørsmål…" />
    <select id="category"><option value="">Alle kategorier</option></select>
    <select id="difficulty">
      <option value="">Alle nivå</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <select id="has_image">
      <option value="">Alle</option>
      <option value="true">🖼️ Med bilde</option>
      <option value="false">📝 Uten bilde</option>
    </select>
    <select id="verdict">
      <option value="">Alle audit</option>
      <option value="MATCH">✅ MATCH</option>
      <option value="MISMATCH">❌ MISMATCH</option>
    </select>
    <select id="active">
      <option value="">Aktiv + Inaktiv</option>
      <option value="true">✅ Kun aktive</option>
      <option value="false">🚫 Kun inaktive</option>
    </select>
    <button onclick="resetFilters()" style="background:var(--card);color:var(--text);border:0;padding:8px 12px;border-radius:6px;cursor:pointer">Nullstill</button>
  </div>

  <div id="results-meta"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">
    <div id="results-meta-left" style="font-size:13px;color:var(--muted)"></div>
    <button onclick="openCreateForm()" style="background:var(--good);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px">
      ➕ Nytt spørsmål
    </button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="pagination" class="pagination"></div>
  </div><!-- end #questions-view -->

  <!-- ── BOOK VIEW ─────────────────────────────────────── -->
  <div id="book-view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:13px;color:var(--muted)" id="book-meta"></div>
      <button onclick="openNewSectionModal()" style="background:var(--good);color:#fff;border:0;
        padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px">
        ➕ Ny seksjon
      </button>
    </div>
    <div id="book-chapters"></div>
  </div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let token = localStorage.getItem('admin_token') || '';
let currentPage = 0;
const PAGE_SIZE = 24;

function toast(msg, good = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = good ? 'var(--good)' : 'var(--bad)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json', ...(opts.headers || {})};
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(API + path, {...opts, headers});
  if (r.status === 401 || r.status === 403) {
    localStorage.removeItem('admin_token'); token = ''; showLogin();
    throw new Error('Auth failed');
  }
  if (!r.ok) {
    let detail = '';
    try { const j = await r.json(); detail = j.detail ? ' — ' + JSON.stringify(j.detail) : ''; } catch (_) {}
    throw new Error('HTTP ' + r.status + ' on ' + (opts.method || 'GET') + ' ' + path + detail);
  }
  return r.json();
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.detail || 'Feil innlogging'; return; }
    if (!data.user.is_admin) { err.textContent = 'Ikke admin-tilgang'; return; }
    token = data.token; localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_email', data.user.email);
    showApp(data.user.email);
  } catch (e) { err.textContent = 'Nettverksfeil: ' + e.message; }
}

function logout() {
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_email');
  token = '';
  showLogin();
}

function showLogin() {
  document.getElementById('login').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('app-header').style.display = 'none';
}

async function showApp(email) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('user-email').textContent = email;
  await loadStats();
  await loadQuestions();
}

async function loadStats() {
  const s = await api('/admin/stats');
  const pct = s.coverage_pct;
  // Cache all existing categories for dropdowns
  window._allCategories = (s.by_category || []).map(c => c._id).filter(Boolean);
  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="v">${s.total}</div>
      <div class="l">Spørsmål</div>
    </div>
    <div class="stat">
      <div class="v">${s.with_image}</div>
      <div class="l">Med bilde</div>
    </div>
    <div class="stat">
      <div class="v">${pct}%</div>
      <div class="l">Coverage</div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
    </div>
    ${s.by_category.map(c => `
      <div class="stat">
        <div class="v" style="font-size:16px">${c.with_image}/${c.count}</div>
        <div class="l">${c._id || '—'}</div>
      </div>
    `).join('')}
  `;
  const catSel = document.getElementById('category');
  if (catSel.options.length <= 1) {
    s.by_category.forEach(c => {
      if (c._id) catSel.insertAdjacentHTML('beforeend',
        `<option value="${c._id}">${c._id} (${c.count})</option>`);
    });
  }
}

async function loadQuestions() {
  const params = new URLSearchParams();
  const search = document.getElementById('search').value.trim();
  const cat = document.getElementById('category').value;
  const diff = document.getElementById('difficulty').value;
  const hasImg = document.getElementById('has_image').value;
  const verdict = document.getElementById('verdict').value;
  const active = document.getElementById('active').value;
  if (search) params.set('search', search);
  if (cat) params.set('category', cat);
  if (diff) params.set('difficulty', diff);
  if (hasImg) params.set('has_image', hasImg);
  if (verdict) params.set('verdict', verdict);
  if (active) params.set('active', active);
  params.set('skip', currentPage * PAGE_SIZE);
  params.set('limit', PAGE_SIZE);

  const grid = document.getElementById('grid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Laster…</div>';

  const data = await api('/admin/questions?' + params);
  window._questions = data.items;

  document.getElementById('results-meta').textContent =
    `Viser ${data.items.length} av ${data.total} treff (side ${currentPage + 1} av ${Math.max(1, Math.ceil(data.total / PAGE_SIZE))})`;

  grid.innerHTML = data.items.map((q, i) => {
    const hasImg = (q.bildeUrl || '').startsWith('data:');
    const correctOpt = (q.options || []).find(o => o.id === q.correctOptionId);
    const correctText = correctOpt ? correctOpt.text?.no || '' : '';
    const verdictTag = q.audit_verdict
      ? `<span class="tag ${q.audit_verdict === 'MATCH' ? 'good' : 'bad'}">${q.audit_verdict === 'MATCH' ? '✓' : '✗'}</span>`
      : '';
    return `
      <div class="q" onclick="showDetail(${i})">
        <div class="img-wrap">
          ${hasImg ? `<img src="${q.bildeUrl}" />` : '<span class="no-img">📝 Tekst-spørsmål</span>'}
        </div>
        <div class="q-text">${escapeHtml(q.question?.no || '')}</div>
        <div class="meta">
          <span class="tag correct">${q.correctOptionId} · ${escapeHtml(correctText.slice(0, 32))}${correctText.length > 32 ? '…' : ''}</span>
        </div>
        <div class="meta" style="margin-top:6px">
          <span class="tag">${q.category || '—'}</span>
          <span class="tag">${q.difficulty || '—'}</span>
          ${verdictTag}
        </div>
      </div>`;
  }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Ingen treff</div>';

  const total = data.total;
  const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
  document.getElementById('pagination').innerHTML = `
    <button ${currentPage === 0 ? 'disabled' : ''} onclick="changePage(-1)">← Forrige</button>
    <span style="display:flex;align-items:center;padding:0 12px;color:var(--muted)">Side ${currentPage + 1} / ${maxPage + 1}</span>
    <button ${currentPage >= maxPage ? 'disabled' : ''} onclick="changePage(1)">Neste →</button>
  `;
}

function changePage(d) { currentPage = Math.max(0, currentPage + d); loadQuestions(); window.scrollTo(0, 0); }
function resetFilters() {
  ['search','category','difficulty','has_image','verdict','active'].forEach(id => document.getElementById(id).value = '');
  currentPage = 0; loadQuestions();
}

function cancelForm() {
  const q = window._currentQ;
  if (!q || !q.id) { closeModal(); return; }
  window._formMode = 'view';
  renderDetail(q, false);
}

function openCreateForm() {
  const empty = {
    id: null,
    question: {no: '', en: '', th: ''},
    options: [
      {id: 'A', text: {no: '', en: '', th: ''}},
      {id: 'B', text: {no: '', en: '', th: ''}},
      {id: 'C', text: {no: '', en: '', th: ''}},
      {id: 'D', text: {no: '', en: '', th: ''}},
    ],
    correctOptionId: 'A',
    explanation: {no: '', en: '', th: ''},
    category: 'Traffic Signs',
    difficulty: 'easy',
    bildeUrl: '',
    active: true,
  };
  window._formMode = 'create';
  window._currentQ = empty;
  renderForm(empty);
  document.getElementById('modal').classList.add('show');
}

function duplicateQuestion() {
  if (!window._currentQ) return;
  const src = window._currentQ;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = null;
  copy.question.no = (copy.question.no || '') + ' (kopi)';
  copy.created_at = null;
  delete copy.audit_verdict;
  delete copy.audit_image_identification;
  delete copy.audit_issues;
  window._formMode = 'create';
  window._currentQ = copy;
  renderForm(copy);
  toast('Duplisert — endre og lagre som nytt');
}

function showDetail(i) {
  const q = window._questions[i];
  window._formMode = 'view';
  renderDetail(q, false);
  document.getElementById('modal').classList.add('show');
}

function renderDetail(q, editing) {
  const hasImg = (q.bildeUrl || '').startsWith('data:');
  const body = document.getElementById('modal-body');
  window._currentQ = q;
  window._editing = editing;

  // If editing or creating -> render form
  if (editing || window._formMode === 'create') {
    renderForm(q);
    return;
  }

  // View-only detail mode
  body.innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h2>${escapeHtml(q.category || 'Spørsmål')} <span style="font-size:12px;color:var(--muted);font-weight:normal">${q.id}</span></h2>

    <div style="margin-bottom:12px">
      ${hasImg ? `<img src="${q.bildeUrl}" />` : '<div style="background:var(--card);padding:40px;text-align:center;border-radius:8px;color:var(--muted);margin-bottom:12px">📝 Ingen bilde</div>'}
    </div>

    ${q.audit_image_identification ? `<div style="color:var(--muted);font-size:13px;margin-bottom:12px">🔎 AI så: <em>${escapeHtml(q.audit_image_identification)}</em></div>` : ''}

    <div class="lang-row"><div class="lbl">🇳🇴 Spørsmål (NO)</div>${escapeHtml(q.question?.no || '')}</div>
    <div class="lang-row"><div class="lbl">🇬🇧 Question (EN)</div>${escapeHtml(q.question?.en || '')}</div>
    <div class="lang-row"><div class="lbl">🇹🇭 คำถาม (TH)</div>${escapeHtml(q.question?.th || '')}</div>

    <h3 style="margin-bottom:8px">Alternativer</h3>
    ${(q.options || []).map(o => `
      <div class="opt ${o.id === q.correctOptionId ? 'correct' : ''}">
        <strong>${o.id === q.correctOptionId ? '✓ ' : ''}${o.id}.</strong> ${escapeHtml(o.text?.no || '')}
        <div style="color:var(--muted);font-size:12px;margin-top:2px">EN: ${escapeHtml(o.text?.en || '')}</div>
        <div style="color:var(--muted);font-size:12px">TH: ${escapeHtml(o.text?.th || '')}</div>
      </div>
    `).join('')}

    <h3 style="margin-top:16px;margin-bottom:8px">Forklaring</h3>
    <div class="lang-row"><div class="lbl">🇳🇴 NO</div>${escapeHtml(q.explanation?.no || '')}</div>
    <div class="lang-row"><div class="lbl">🇬🇧 EN</div>${escapeHtml(q.explanation?.en || '')}</div>
    <div class="lang-row"><div class="lbl">🇹🇭 TH</div>${escapeHtml(q.explanation?.th || '')}</div>

    <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">
      <span class="tag">📂 ${q.category || '—'}</span>
      <span class="tag">🎯 ${q.difficulty || '—'}</span>
      ${q.audit_verdict ? `<span class="tag ${q.audit_verdict === 'MATCH' ? 'good' : 'bad'}">AI: ${q.audit_verdict}</span>` : ''}

function inputStyle(type) {
  const base = 'width:100%;background:#0f172a;color:var(--text);border:1px solid #475569;border-radius:6px;padding:8px;font-size:14px;font-family:inherit;box-sizing:border-box';
  return type === 'single' ? base + ';margin-top:4px' : base + ';min-height:60px;resize:vertical';
}
function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function collectForm() {
  const correctEl = document.querySelector('input[name="correct"]:checked');
  if (!correctEl) throw new Error('Velg riktig svar');
  const qno = document.getElementById('e_qno').value.trim();
  if (!qno) throw new Error('Spørsmål (NO) er påkrevd');

  let category = document.getElementById('e_cat').value;
  if (category === '__new__') {
    const newCat = prompt('Skriv inn ny kategori-navn:');
    if (!newCat || !newCat.trim()) throw new Error('Ny kategori ble ikke angitt');
    category = newCat.trim();
  }

  return {
    question: {
      no: qno,
      en: document.getElementById('e_qen').value.trim(),
      th: document.getElementById('e_qth').value.trim(),
    },
    explanation: {
      no: document.getElementById('e_expno').value.trim(),
      en: document.getElementById('e_expen').value.trim(),
      th: document.getElementById('e_expth').value.trim(),
    },
    options: ['A','B','C','D'].map(id => ({
      id,
      text: {
        no: (document.getElementById(`e_opt_${id}_no`) || {}).value || '',
        en: (document.getElementById(`e_opt_${id}_en`) || {}).value || '',
        th: (document.getElementById(`e_opt_${id}_th`) || {}).value || '',
      },
    })),
    correctOptionId: correctEl.value,
    category: document.getElementById('e_cat').value,
    difficulty: document.getElementById('e_diff').value,
    active: document.getElementById('e_active').checked,
  };
}

async function saveForm() {
  let patch;
  try {
    patch = collectForm();
  } catch (e) {
    toast(e.message, false);
    return;
  }
  const q = window._currentQ;
  const isNew = !q.id || window._formMode === 'create';
  try {
    let saved;
    if (isNew) {
      // For create: include bildeUrl if already uploaded during form (stored in q.bildeUrl)
      if (q.bildeUrl) patch.bildeUrl = q.bildeUrl;
      saved = await api('/admin/questions', {method: 'POST', body: JSON.stringify(patch)});
      toast('✅ Opprettet');
    } else {
      saved = await api('/admin/questions/' + q.id, {method: 'PATCH', body: JSON.stringify(patch)});
      toast('✅ Lagret');
    }
    window._formMode = 'view';
    window._currentQ = saved;
    // Update local list
    const idx = window._questions.findIndex(x => x.id === saved.id);
    if (idx >= 0) window._questions[idx] = saved;
    await loadStats();
    await loadQuestions();
    renderDetail(saved, false);
  } catch (e) {
    toast('Feil: ' + e.message, false);
  }
}

async function handleFormImageUpload(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const q = window._currentQ;
  const isNew = !q.id || window._formMode === 'create';

  if (isNew) {
    // For new question: convert to base64 in browser, stage it
    try {
      const reader = new FileReader();
      reader.onload = e => {
        // Downscale in browser via canvas
        const img = new Image();
        img.onload = () => {
          const maxDim = 600;
          let w = img.width, h = img.height;
          if (Math.max(w, h) > maxDim) {
            const r = maxDim / Math.max(w, h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUri = canvas.toDataURL('image/jpeg', 0.82);
          q.bildeUrl = dataUri;
          toast(`Bilde klar (${Math.round(dataUri.length / 1024)} KB)`);
          renderForm(q);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } catch (e) { toast('Feil: ' + e.message, false); }
  } else {
    // Existing question: upload to server immediately
    const fd = new FormData();
    fd.append('file', file);
    toast('Laster opp…');
    try {
      const r = await fetch(API + '/admin/questions/' + q.id + '/image', {
        method: 'POST', headers: {Authorization: 'Bearer ' + token}, body: fd,
      });
      if (!r.ok) { const err = await r.json().catch(() => ({})); throw new Error(err.detail || 'HTTP ' + r.status); }
      const d = await r.json();
      toast(`✅ Bilde opplastet (${d.size_kb} KB)`);
      q.bildeUrl = d.bildeUrl;
      const idx = window._questions.findIndex(x => x.id === q.id);
      if (idx >= 0) window._questions[idx].bildeUrl = d.bildeUrl;
      renderForm(q);
      await loadStats();
      await loadQuestions();
    } catch (e) { toast('Feil: ' + e.message, false); }
  }
}

function handleDropForm(ev) {
  ev.preventDefault();
  ev.target.style.borderColor = 'var(--card)';
  const file = ev.dataTransfer.files[0];
  if (file) {
    const input = document.getElementById('img-input');
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    handleFormImageUpload({target: input});
  }
}

async function removeFormImage() {
  if (!confirm('Fjern bildet?')) return;
  const q = window._currentQ;
  const isNew = !q.id || window._formMode === 'create';
  if (isNew) {
    q.bildeUrl = '';
    renderForm(q);
    toast('Bilde fjernet fra skjema');
  } else {
    try {
      await api('/admin/questions/' + q.id + '/image', {method: 'DELETE'});
      q.bildeUrl = '';
      const idx = window._questions.findIndex(x => x.id === q.id);
      if (idx >= 0) window._questions[idx].bildeUrl = '';
      renderForm(q);
      await loadStats(); await loadQuestions();
      toast('Bilde fjernet');
    } catch (e) { toast('Feil: ' + e.message, false); }
  }
}

async function reaudit(id) {
  toast('Kjører AI-audit…');
  try {
    const r = await api('/admin/questions/' + id + '/audit', {method: 'POST'});
    const v = r.verdict;
    const badge = v === 'MATCH' ? '✅' : v === 'MISMATCH' ? '❌' : '⚠️';
    toast(`${badge} ${v}: ${r.image_identification?.slice(0, 60) || ''}`, v === 'MATCH');
    // Refresh question
    window._currentQ.audit_verdict = v;
    window._currentQ.audit_image_identification = r.image_identification;
    const idx = window._questions.findIndex(x => x.id === id);
    if (idx >= 0) {
      window._questions[idx].audit_verdict = v;
      window._questions[idx].audit_image_identification = r.image_identification;
    }
    renderDetail(window._currentQ, false);
  } catch (e) { toast('Audit feilet: ' + e.message, false); }
}

async function deleteQuestion(id) {

async function permanentDeleteQuestion(id) {

async function setActive(id, active) {

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function switchTab(tab) {
  document.getElementById('questions-view').style.display = tab === 'questions' ? '' : 'none';
  document.getElementById('book-view').style.display     = tab === 'book'      ? '' : 'none';
  document.getElementById('tab-questions').classList.toggle('active', tab === 'questions');

let _bookSections = [];

async function loadBook() {
  const r = await fetch(API + '/admin/book/sections', {headers:{Authorization:'Bearer '+token}});
  _bookSections = await r.json();

  // Group by chapter
  const byChapter = {};
  _bookSections.forEach(s => {
    if (!byChapter[s.chapter_num]) byChapter[s.chapter_num] = [];
    byChapter[s.chapter_num].push(s);
  });

  document.getElementById('book-meta').textContent =
    `${_bookSections.length} seksjoner fordelt på ${Object.keys(byChapter).length} kapitler`;

  const container = document.getElementById('book-chapters');
  container.innerHTML = '';
  const chTitles = { 1:'Grunnleggende trafikklære', 2:'Mennesket i trafikken',
                     3:'Trafikksystemet og regler', 4:'Kjøretøy og vegtrafikkloven' };
  const chIcons  = { 1:'📗', 2:'👤', 3:'🚦', 4:'🚗' };

  Object.keys(byChapter).sort((a,b)=>+a-+b).forEach(ch => {
    const secs = byChapter[ch];
    const div = document.createElement('div');
    div.className = 'book-ch';
    div.innerHTML = `
      <div class="book-ch-head" onclick="toggleChapter(this)">
        <h3>${chIcons[ch]||'📘'} Kapittel ${ch} — ${chTitles[ch]||''}</h3>
        <span class="meta">${secs.length} seksjoner ▾</span>
      </div>
      <div class="book-ch-body">
        ${secs.map(s => renderSecRow(s)).join('')}
      </div>`;
    container.appendChild(div);
  });
}

function renderSecRow(s) {
  const title   = (s.section_title && s.section_title.no) || '—';
  const preview = (s.content && s.content.no) || '';
  const hasImg  = !!s.has_image; // we exclude image blob from list, use flag
  // Check if section came with image indicator
  const imgHtml = `<div class="no-img">📄</div>`;
  return `<div class="book-sec" id="bsec-${s.id}">
    <div class="book-sec-thumb">${imgHtml}</div>
    <div class="book-sec-info">
      <div class="num">Seksjon ${s.section_num}</div>
      <div class="title">${escapeHtml(title)}</div>
      <div class="preview">${escapeHtml(preview)}</div>
    </div>
    <div class="book-sec-actions">
      <button class="btn-edit" onclick="openEditSection('${s.id}')">✏️ Rediger</button>
      <button class="btn-del"  onclick="deleteSection('${s.id}')">🗑</button>
    </div>
  </div>`;
}

function toggleChapter(head) {
  const body = head.nextElementSibling;
  body.classList.toggle('open');
  head.querySelector('.meta').textContent =
    head.querySelector('.meta').textContent.replace(/[▾▴]/, body.classList.contains('open') ? '▴' : '▾');
}

      </div>
      <div>
        <div class="lang-row"><div class="lbl">🇹🇭 Innhold thai</div>
          <textarea id="c-th" rows="6" style="width:100%;background:var(--card);color:var(--text);border:1px solid #475569;border-radius:6px;padding:8px;font-size:14px">${escapeHtml(c.th||'')}</textarea>
        </div>
      </div>
      <div>
        <div class="lang-row"><div class="lbl">🇬🇧 Innhold engelsk</div>
          <textarea id="c-en" rows="6" style="width:100%;background:var(--card);color:var(--text);border:1px solid #475569;border-radius:6px;padding:8px;font-size:14px">${escapeHtml(c.en||'')}</textarea>
        </div>
      </div>
    </div>

    <div style="margin-bottom:20px">
      <div class="lbl" style="margin-bottom:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">🖼️ Bilde</div>
      <div id="cur-img-wrap" style="margin-bottom:10px"></div>
      <input type="file" id="img-file" accept="image/*" style="color:var(--text)"/>
      <button onclick="uploadSectionImage('${s.id}')" style="background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin-left:8px">Last opp bilde</button>
      <button onclick="removeSectionImage('${s.id}')" style="background:var(--bad);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin-left:6px">Fjern bilde</button>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeModal()" style="background:var(--card);color:var(--text);border:0;padding:10px 20px;border-radius:8px;cursor:pointer">Avbryt</button>
      <button onclick="saveSection('${s.id}')" style="background:var(--good);color:#fff;border:0;padding:10px 22px;border-radius:8px;cursor:pointer;font-weight:700">💾 Lagre</button>
    </div>
  `;

  // Load current image
  loadSectionImage(s.id);
  document.getElementById('modal').classList.add('show');
}

async function loadSectionImage(id) {
  const wrap = document.getElementById('cur-img-wrap');
  if (!wrap) return;
  const r = await fetch(API + '/chapters/' + _bookSections.find(x=>x.id===id)?.chapter_num);
  if (!r.ok) return;
  const secs = await r.json();
  const s = secs.find(x => x.id === id);
  if (s && s.image) {
    wrap.innerHTML = `<img src="${s.image}" style="max-height:200px;border-radius:8px;border:1px solid var(--card)"/>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Nåværende bilde</div>`;
  } else {
    wrap.innerHTML = `<div style="color:var(--muted);font-size:13px">Ingen bilde ennå</div>`;
  }
}

async function saveSection(id) {
  const body = {
    section_title: { no: document.getElementById('t-no').value.trim(),
                     th: document.getElementById('t-th').value.trim(),
                     en: document.getElementById('t-en').value.trim() },
    content:       { no: document.getElementById('c-no').value.trim(),
                     th: document.getElementById('c-th').value.trim(),
                     en: document.getElementById('c-en').value.trim() },
  };
  const r = await fetch(API + '/admin/book/sections/' + id, {
    method: 'PATCH', headers: {'Content-Type':'application/json', Authorization:'Bearer '+token},
    body: JSON.stringify(body),
  });
  if (r.ok) { toast('✅ Lagret!'); closeModal(); loadBook(); }
  else toast('Feil ved lagring', false);
}

async function uploadSectionImage(id) {
  const file = document.getElementById('img-file').files[0];
  if (!file) { toast('Velg et bilde først', false); return; }
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch(API + '/admin/book/sections/' + id + '/image', {
    method: 'POST', headers: {Authorization: 'Bearer ' + token}, body: fd,
  });
  const data = await r.json();
  if (r.ok) { toast(`✅ Bilde lastet opp (${data.size_kb} KB)`); loadSectionImage(id); }
  else toast('Feil: ' + (data.detail || 'ukjent'), false);
}

async function removeSectionImage(id) {
  if (!confirm('Fjerne bildet?')) return;
  const r = await fetch(API + '/admin/book/sections/' + id + '/image', {
    method: 'DELETE', headers: {Authorization: 'Bearer ' + token},
  });
  if (r.ok) { toast('🗑 Bilde fjernet'); loadSectionImage(id); }
  else toast('Feil', false);
}

async function deleteSection(id) {
  const s = _bookSections.find(x => x.id === id);
  const title = s?.section_title?.no || id;
  if (!confirm(`Slette seksjon "${title}"? Dette kan ikke angres.`)) return;
  const r = await fetch(API + '/admin/book/sections/' + id, {
    method: 'DELETE', headers: {Authorization: 'Bearer ' + token},
  });
  if (r.ok) { toast('🗑 Seksjon slettet'); loadBook(); }
  else toast('Feil ved sletting', false);
}

async function createSection() {
  const body = {
    chapter_num: +document.getElementById('new-ch').value,
    section_title: { no: document.getElementById('nt-no').value.trim(),
                     th: document.getElementById('nt-th').value.trim(),
                     en: document.getElementById('nt-en').value.trim() },
    content:       { no: document.getElementById('nc-no').value.trim(),
                     th: document.getElementById('nc-th').value.trim(),
                     en: document.getElementById('nc-en').value.trim() },
  };
  if (!body.section_title.no) { toast('Tittel (norsk) er påkrevd', false); return; }
  const r = await fetch(API + '/admin/book/sections', {
    method: 'POST', headers: {'Content-Type':'application/json', Authorization:'Bearer '+token},
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (r.ok) { toast(`✅ Seksjon ${data.section_num} opprettet!`); closeModal(); loadBook(); }
  else toast('Feil: ' + (data.detail || 'ukjent'), false);
}
