<!doctype html><html lang="__HTML_LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Thai2Drive</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#081222;color:#e8edf6}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:18px}header,nav,.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:18px}h1{font-size:1.35rem;margin:0}h2{font-size:1.25rem;margin:8px 0}p{line-height:1.55}button,select,a{font:inherit}button,select{min-height:44px;border:1px solid #416078;border-radius:12px;background:#12263a;color:inherit;padding:9px 15px}button{cursor:pointer}button:hover{border-color:#69dce9}button:disabled{opacity:.5;cursor:default}a{color:#8ee8f0}select{max-width:100%}nav{margin:16px 0}#jump{flex:1;min-width:160px}article,.question{background:#0e1e30;border:1px solid #29485c;border-radius:18px;overflow:hidden}.media{background:#060e19}.media img{display:block;width:100%;height:auto;object-fit:contain}.media:not(:has(img)){min-height:220px;display:flex;align-items:center;justify-content:center}.body{padding:14px 20px}.body p{margin:8px 0}.meta,.status{font-size:.85rem;color:#bbcadb}.status{border-left:3px solid #bc98ee;padding:8px 12px;margin:12px 0}.question{padding:20px;margin-top:18px}.answers{display:grid;gap:10px}.answers button{text-align:left}.answers button.selected{border-color:#ffad6b;background:#2c2330}#feedback{white-space:pre-wrap;line-height:1.65}#error{color:#ffc3aa}#loading{min-height:40vh}#book[hidden]{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#source{margin-bottom:0}@media(max-width:600px){main{padding:12px}.body{padding:12px}.question{padding:15px}header{align-items:flex-start}h1{font-size:1.15rem}}
</style></head><body><main><header><h1 id="heading"></h1><div class="tools"><select id="language" aria-label="__LANGUAGE_LABEL__"><option value="no">Norsk</option><option value="th">ไทย</option><option value="en">English</option></select><button id="exit"></button></div></header><div id="notice" class="status"></div><p id="error" role="alert"></p><p id="loading" role="status"></p><section id="book" hidden><nav><button id="previous"></button><select id="jump"></select><button id="next"></button></nav><p id="position" class="meta"></p><p id="structure" class="meta"></p><div id="badges" class="status"></div><p id="source" class="meta"></p><article><div class="media" id="media"></div><div class="body"><h2 id="title"></h2><p id="text"></p></div></article><section class="question"><ul id="points"></ul><h2 id="question"></h2><div id="options" class="answers"></div><div class="toolbar"><button id="submit"></button><button id="michael" hidden></button></div><p id="feedback" role="status"></p><p id="explanationType" class="meta"></p></section></section><p><a href="/api/web" id="home"></a></p></main>
<script>
'use strict';
const UI={
no:{heading:'Michaels visuelle lærebok',notice:'Privat redaksjonell forhåndsvisning. Utkast er ikke åpnet for elever. Bilder og leksjonstekst vurderes hver for seg.',exit:'Logg ut',home:'Til Thai2Drive',previous:'Forrige',next:'Neste',page:'Trykt side',pdf:'PDF-side',part:'Del',section:'Avsnitt',book:'Lærebok Klasse B',missing:'Mangler oversettelse',chapterMissing:'Kapittel-/avsnittstittel mangler på dette språket',loading:'Laster boka …',denied:'Tilgangen er avsluttet. Åpne forhåndsvisningslenken etter innlogging.',error:'Kunne ikke hente innhold. Prøv igjen.',draft:'Utkast',awaiting_michael:'Klart for Michaels vurdering · ikke faglig godkjent',candidate:'Bildekandidat · kobling må vurderes',approved_image:'Bildebytes godkjent · leksjonstekst vurderes separat',unresolved:'Bildekobling uavklart · bildet er skjult',hash_mismatch:'Bildehash avviker · bildet er skjult',imageMissing:'Bilde mangler',unconfirmed:'Faginnhold har uavklarte punkter',submit:'Svar',choose:'Velg et svar først.',correct:'Riktig svar.',incorrect:'Se riktig svar nedenfor.',answer:'Riktig alternativ',michael:'Spør Michael AI',teacherMissing:'Kontrollert lærergrunnlag mangler. Krever faglig gjennomgang.',deterministic:'Kontrollert forklaring fra lærergrunnlaget · ikke et nytt AI-svar',generated:'Nytt svar fra Michael AI',modelUnavailable:'AI-forklaringen er ikke tilgjengelig nå. Den kontrollerte forklaringen står over.'},
th:{heading:'หนังสือเรียนภาพของไมเคิล',notice:'ตัวอย่างส่วนตัวสำหรับตรวจแก้ ต้นฉบับร่างยังไม่เปิดให้นักเรียน ภาพและเนื้อหาบทเรียนต้องพิจารณาแยกกัน',exit:'ออกจากระบบ',home:'กลับสู่แอป',previous:'ก่อนหน้า',next:'ถัดไป',page:'หน้าในหนังสือ',pdf:'หน้าในไฟล์',part:'ส่วน',section:'หัวข้อ',book:'หนังสือเรียนชั้นบี',missing:'ยังไม่มีคำแปล',chapterMissing:'ยังไม่มีคำแปลชื่อบทหรือหัวข้อในภาษานี้',loading:'กำลังโหลดหนังสือ …',denied:'สิทธิ์เข้าถึงสิ้นสุดแล้ว เข้าสู่ระบบและเปิดลิงก์ตัวอย่างอีกครั้ง',error:'โหลดเนื้อหาไม่สำเร็จ โปรดลองอีกครั้ง',draft:'ต้นฉบับร่าง',awaiting_michael:'พร้อมให้ไมเคิลตรวจ · ยังไม่ผ่านการรับรองเนื้อหา',candidate:'ภาพรอตรวจ · ต้องตรวจความเชื่อมโยงกับเนื้อหา',approved_image:'ไฟล์ภาพผ่านการรับรอง · เนื้อหาบทเรียนต้องตรวจแยก',unresolved:'ยังยืนยันภาพกับเนื้อหาไม่ได้ · ซ่อนภาพแล้ว',hash_mismatch:'ไฟล์ภาพไม่ตรงกับรุ่นที่ระบุ · ซ่อนภาพแล้ว',imageMissing:'ยังไม่มีภาพ',unconfirmed:'มีประเด็นเนื้อหาที่ยังไม่ยืนยัน',submit:'ตอบ',choose:'เลือกคำตอบก่อน',correct:'ตอบถูก',incorrect:'ดูคำตอบที่ถูกด้านล่าง',answer:'ตัวเลือกที่ถูก',michael:'ถามไมเคิล',teacherMissing:'ยังไม่มีข้อมูลครูที่ผ่านการตรวจ ต้องตรวจเนื้อหาก่อน',deterministic:'คำอธิบายจากข้อมูลครูที่ตรวจแล้ว · ไม่ใช่คำตอบใหม่จากเอไอ',generated:'คำตอบใหม่จากไมเคิล',modelUnavailable:'ยังใช้คำอธิบายจากเอไอไม่ได้ ข้อมูลครูที่ตรวจแล้วแสดงอยู่ด้านบน'},
en:{heading:'Michael’s visual textbook',notice:'Private editorial preview. Drafts are not open to learners. Images and lesson text are reviewed separately.',exit:'Sign out',home:'Back to Thai2Drive',previous:'Previous',next:'Next',page:'Printed page',pdf:'PDF page',part:'Part',section:'Section',book:'Class B textbook',missing:'Translation missing',chapterMissing:'Chapter or section heading is missing in this language',loading:'Loading the book …',denied:'Access ended. Sign in and reopen the preview link.',error:'Could not load content. Please try again.',draft:'Draft',awaiting_michael:'Ready for Michael’s review · content not approved',candidate:'Candidate image · lesson binding needs review',approved_image:'Image bytes approved · lesson text reviewed separately',unresolved:'Image binding unresolved · image hidden',hash_mismatch:'Image hash mismatch · image hidden',imageMissing:'Image missing',unconfirmed:'Some subject matter is unconfirmed',submit:'Answer',choose:'Choose an answer first.',correct:'Correct.',incorrect:'See the correct answer below.',answer:'Correct option',michael:'Ask Michael AI',teacherMissing:'Controlled teacher basis unavailable. Subject review required.',deterministic:'Controlled explanation from teacher material · not a new AI response',generated:'New response from Michael AI',modelUnavailable:'AI explanation unavailable now. The controlled explanation remains above.'}
};
Object.assign(UI.no,{image_translation_missing:'Bilde med norsk tekst · oversettelse mangler'});Object.assign(UI.th,{image_translation_missing:'ภาพมีข้อความนอร์เวย์ · ยังไม่มีภาพที่แปลแล้ว'});Object.assign(UI.en,{image_translation_missing:'Image contains Norwegian text · translated image missing'});
const $=id=>document.getElementById(id);let lang='__LANG__',rows=[],index=0,selected=null,attempt=null,answered=false,generation=0,images=[];
const originalToken=localStorage.getItem('t2d_token');const text=(id,value)=>$(id).textContent=value;
function clearImages(){images.forEach(u=>URL.revokeObjectURL(u));images=[];}
function lock(){generation++;rows=[];clearImages();$('book').hidden=true;$('loading').hidden=true;text('error',UI[lang].denied);$('media').replaceChildren();text('feedback','');text('title','');}
async function api(path,body){if(!originalToken||localStorage.getItem('t2d_token')!==originalToken){lock();throw Error('auth');}const response=await fetch('/api/book-preview/'+path,{method:body?'POST':'GET',cache:'no-store',headers:{Authorization:'Bearer '+originalToken,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(response.status===401||response.status===403){lock();throw Error('auth');}if(!response.ok)throw Error('request');return response;}
function identity(){return {row_id:rows[index].id,version:rows[index].version,language:lang};}
async function render(){const g=++generation,r=rows[index],ui=UI[lang];if(!r)return;clearImages();selected=null;attempt=null;answered=false;$('michael').hidden=true;$('submit').disabled=false;text('feedback','');text('error','');text('explanationType','');$('media').replaceChildren();text('title',r.title||ui.missing);text('text',r.text||ui.missing);$('points').replaceChildren();r.points.forEach(point=>{const li=document.createElement('li');li.textContent=point||ui.missing;$('points').append(li);});text('position',(index+1)+' / '+rows.length+' · '+r.id);text('source',ui.book+' · '+ui.page+' '+r.printed_page+' · '+ui.pdf+' '+r.pdf_page);text('structure',ui.part+' '+r.part+' · '+ui.section+' '+(r.section_no||'')+' · '+(r.chapter&&r.section?r.chapter+' · '+r.section:ui.chapterMissing));text('badges',(ui[r.review_status]||ui.draft)+' · '+(ui[r.image_status]||ui.imageMissing)+(r.has_unconfirmed?' · '+ui.unconfirmed:''));text('question',r.question||ui.missing);$('previous').disabled=index===0;$('next').disabled=index===rows.length-1;$('jump').value=String(index);localStorage.setItem('t2d_book_preview_row',r.id);$('options').replaceChildren();r.options.forEach((option,i)=>{const b=document.createElement('button');b.textContent=option||ui.missing;b.disabled=!option;b.onclick=()=>{if(answered)return;selected=i;[...$('options').children].forEach((v,j)=>v.classList.toggle('selected',i===j));};$('options').append(b);});
if(r.image_url){try{const response=await api('image/'+encodeURIComponent(r.id)+'/'+r.image_sha256);const blob=await response.blob();if(g!==generation)return;const image=document.createElement('img'),url=URL.createObjectURL(blob);images.push(url);image.src=url;image.alt=r.title||ui.missing;$('media').append(image);}catch(e){if(g===generation)text('media',ui.imageMissing);}}else{text('media',ui[r.image_status]||ui.imageMissing);}}
async function load(){const g=++generation,ui=UI[lang];text('heading',ui.heading);text('notice',ui.notice);['exit','home','previous','next','submit','michael'].forEach(id=>text(id,ui[id]));$('language').value=lang;$('language').setAttribute('aria-label',{no:'Språk',th:'ภาษา',en:'Language'}[lang]);document.documentElement.lang=lang==='no'?'nb':lang;text('loading',ui.loading);$('loading').hidden=false;$('book').hidden=true;try{const data=await(await api('catalog?language='+lang)).json();if(g!==generation)return;rows=data.rows;const saved=localStorage.getItem('t2d_book_preview_row');index=Math.max(0,rows.findIndex(r=>r.id===saved));$('jump').replaceChildren();rows.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.printed_page+' · '+(r.title||ui.missing);$('jump').append(o);});$('loading').hidden=true;$('book').hidden=false;await render();}catch(e){if(g===generation){$('loading').hidden=true;text('error',ui.error);}}}
$('language').onchange=()=>{lang=$('language').value;localStorage.setItem('t2d_lang',lang);history.replaceState(null,'','?language='+lang);load();};$('previous').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('jump').onchange=()=>{index=Number($('jump').value);render();};
$('submit').onclick=async()=>{if(selected===null){text('error',UI[lang].choose);return;}const g=generation,body=identity();$('submit').disabled=true;try{attempt=(await(await api('attempt',body)).json()).attempt_id;const result=await(await api('attempt/'+attempt+'/answer',{...body,option:selected})).json();if(g!==generation)return;answered=true;[...$('options').children].forEach(b=>b.disabled=true);text('feedback',(result.correct?UI[lang].correct:UI[lang].incorrect)+'\n'+UI[lang].answer+': '+rows[index].options[result.correct_option]+'\n\n'+(result.teacher.basis||UI[lang].teacherMissing));text('explanationType',UI[lang].deterministic);$('michael').hidden=!result.teacher.basis;$('michael').disabled=false;}catch(e){if(g===generation){text('error',UI[lang].error);$('submit').disabled=false;}}};
$('michael').onclick=async()=>{const g=generation;$('michael').disabled=true;try{const result=await(await api('attempt/'+attempt+'/michael',identity())).json();if(g===generation){text('feedback',$('feedback').textContent+'\n\n'+result.reply);text('explanationType',UI[lang].generated);}}catch(e){if(g===generation)text('error',UI[lang].modelUnavailable);}};
$('exit').onclick=async()=>{lock();try{await fetch('/api/book-preview/logout',{method:'POST'});}finally{localStorage.removeItem('t2d_token');location.replace('/api/web');}};window.addEventListener('storage',e=>{if(e.key==='t2d_token'||e.key===null)lock();});window.addEventListener('pageshow',e=>{if(e.persisted)load();});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localStorage.getItem('t2d_token')!==originalToken)lock();});load();
</script></body></html>
